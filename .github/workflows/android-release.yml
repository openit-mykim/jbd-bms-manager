name: Android Release Build

on:
  workflow_dispatch:
  # Pushes to main build and publish; every PR to main (any branch prefix) gets the
  # same build as a check. Docs-only changes are skipped by the path filter.
  push:
    branches: ["main"]
    paths:
      - "overlays/**"
      - "assets/**"
      - "scripts/apply-*.py"
      - "scripts/check-design-tokens.py"
      - "scripts/verify.sh"
      - "scripts/release-guard.sh"
      - "version.properties"
      - "release-notes/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "overlays/**"
      - "assets/**"
      - "scripts/apply-*.py"
      - "scripts/check-design-tokens.py"
      - "scripts/verify.sh"
      - "scripts/release-guard.sh"
      - "version.properties"
      - "release-notes/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

concurrency:
  # Per-ref groups so parallel feature-branch builds never cancel each other
  # or an in-progress main/release build. Same-ref pushes still supersede
  # older runs for that ref only.
  group: android-release-${{ github.ref }}
  # Never cancel a main build mid-publish; superseded PR builds may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Versions and the pinned upstream come from version.properties (see the first step).

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JBD BMS Manager
        uses: actions/checkout@v6
        with:
          path: manager

      - name: Read version.properties (single source of truth)
        run: |
          prop() { sed -n "s/^$1=//p" manager/version.properties; }
          version="$(prop versionName)"
          {
            echo "UPSTREAM_REPO=$(prop upstreamRepo)"
            echo "UPSTREAM_COMMIT=$(prop upstreamCommit)"
            echo "RELEASE_VERSION=${version}"
            echo "RELEASE_TAG=v${version}"
            echo "APK_NAME=jbd-bms-manager-v${version}.apk"
          } >> "$GITHUB_ENV"

      - name: Checkout pinned OpenJBD baseline
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream-src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream-src/**/*.gradle*

      - name: Apply JBD BMS Manager product overlay
        run: python3 manager/scripts/apply-product-overlay.py upstream-src

      - name: Design token check (text sizes, spacing grid, translations)
        run: python3 manager/scripts/check-design-tokens.py upstream-src

      - name: Grant Gradle wrapper permission
        run: chmod +x upstream-src/gradlew

      - name: Run unit tests
        working-directory: upstream-src
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: upstream-src/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Android lint (new findings fail; upstream findings are in lint-baseline.xml)
        working-directory: upstream-src
        run: ./gradlew lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: upstream-src/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Restore release keystore (fixed signing key, issue #9)
        env:
          KEYSTORE_B64: ${{ secrets.JBD_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "${KEYSTORE_B64}" ]; then
            # Fork PRs get no secrets. main must never fall back to debug signing.
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "::error::JBD_RELEASE_KEYSTORE_B64 secret missing; refusing to publish a debug-signed release."
              exit 1
            fi
            echo "::warning::No release keystore secret; this check build is debug-signed and is not published."
            echo "SIGNED_RELEASE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          umask 077
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.p12"
          echo "JBD_RELEASE_KEYSTORE_FILE=${RUNNER_TEMP}/release.p12" >> "$GITHUB_ENV"
          echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: upstream-src
        env:
          JBD_RELEASE_STORE_PASSWORD: ${{ secrets.JBD_RELEASE_STORE_PASSWORD }}
          JBD_RELEASE_KEY_ALIAS: ${{ secrets.JBD_RELEASE_KEY_ALIAS }}
        run: |
          if [ "${SIGNED_RELEASE}" = "true" ]; then
            ./gradlew assembleRelease
            echo "BUILT_APK=upstream-src/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug
            echo "BUILT_APK=upstream-src/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Remove release keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.p12"

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp "${BUILT_APK}" "dist/${APK_NAME}"
          # Write the digest with a bare file name so `sha256sum -c` works
          # from the download directory.
          (cd dist && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")

      - name: Release guard (credentials, signing)
        # Blocking for credentials and for debug signing. Only an unpublished check build
        # without access to the signing secret may be debug-signed.
        run: |
          allow=""
          if [ "${SIGNED_RELEASE}" != "true" ]; then allow="--allow-debug-signing"; fi
          bash manager/scripts/release-guard.sh "dist/${APK_NAME}" ${allow} | tee dist/release-guard.txt
          exit "${PIPESTATUS[0]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: jbd-bms-manager-apk
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
            dist/release-guard.txt
          if-no-files-found: error
          retention-days: 90

      - name: Check release notes exist
        run: |
          test -s "manager/release-notes/${RELEASE_TAG}.md" || {
            echo "::error::Missing manager/release-notes/${RELEASE_TAG}.md"; exit 1; }

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && env.SIGNED_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Published releases are immutable (docs/release-process.md).
          # A main push that does not bump RELEASE_TAG must not replace the
          # existing APK, so skip publishing instead of clobbering assets.
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::warning::Release ${RELEASE_TAG} already exists; skipping publish. Bump the version to release this build."
          else
            gh release create "${RELEASE_TAG}" "dist/${APK_NAME}" "dist/${APK_NAME}.sha256" dist/release-guard.txt \
              --target "${GITHUB_SHA}" \
              --title "JBD BMS Manager ${RELEASE_TAG}" \
              --notes-file "manager/release-notes/${RELEASE_TAG}.md" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
