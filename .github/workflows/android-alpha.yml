name: Android Alpha Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/**", "fix/**", "refactor/**", "test/**", "chore/**"]
    paths:
      - "overlays/**"
      - "scripts/apply-*.py"
      - ".github/workflows/android-alpha.yml"

permissions:
  contents: write

concurrency:
  # Per-ref groups so parallel feature-branch builds never cancel each other
  # or an in-progress main/release build. Same-ref pushes still supersede
  # older runs for that ref only.
  group: android-alpha-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: gytxtx/OpenJBD
  UPSTREAM_COMMIT: 7e3e225a128f6e0d69425b98a2670d8d69594885
  RELEASE_TAG: v0.1.0-alpha.9
  APK_NAME: jbd-bms-manager-v0.1.0-alpha.9.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JBD BMS Manager
        uses: actions/checkout@v6
        with:
          path: manager

      - name: Checkout pinned OpenJBD baseline
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream-src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream-src/**/*.gradle*

      - name: Apply JBD BMS Manager product overlay
        run: |
          python3 manager/scripts/apply-product-overlay.py upstream-src
          python3 manager/scripts/apply-alpha3.py upstream-src
          python3 manager/scripts/apply-alpha4.py upstream-src
          python3 manager/scripts/apply-alpha5.py upstream-src
          python3 manager/scripts/apply-alpha6.py upstream-src
          python3 manager/scripts/apply-alpha7.py upstream-src
          python3 manager/scripts/apply-alpha8.py upstream-src
          python3 manager/scripts/apply-alpha9.py upstream-src

      - name: Grant Gradle wrapper permission
        run: chmod +x upstream-src/gradlew

      - name: Run unit tests
        working-directory: upstream-src
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: upstream-src
        run: ./gradlew assembleDebug

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp upstream-src/app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" > "dist/${APK_NAME}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: jbd-bms-manager-alpha-apk
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Write prerelease notes
        if: github.ref == 'refs/heads/main'
        run: |
          cat > release-notes.md <<'EOF'
          ## JBD BMS Manager v0.1.0-alpha.9

          유지보수 모드의 나머지 섹션(캘리브레이션·MOS 제어·백업 및 복원)을 추가해 제어 탭의 모든 유지보수 항목이 동작하는 테스트 빌드입니다.

          ### 변경 내용
          - 캘리브레이션: 전류 보정(무부하 제로·충전·방전), 셀 전압 보정(셀별), NTC 온도 보정 — BMS 읽기값 / 외부 기준 측정값 / 적용될 작업을 분리 표시(설계 계약 준수), 기존 검증 트랜잭션으로 적용·재검증
          - MOS 제어: 충·방전 FET 차단/허용 (레지스터 0xE1) — 실시간 도통 상태 표시, 강한 경고, 적용·재검증
          - 백업 및 복원: 설정 JSON 내보내기(저장 위치 선택) + 백업 불러오기 → 차이 검토 → 일괄 적용(모든 항목 재검증 성공 시에만 커밋)
          - 제어 탭 8개 유지보수 항목 모두 활성화 (진단은 읽기 전용 유지)

          ### 현재 제한
          - 실기기에서의 캘리브레이션·MOS·복원 동작은 아직 물리 검증 전입니다(테스트 빌드). 결과 화면의 검증·커밋·재확인 상태를 반드시 확인하세요.
          - 전류 보정의 스케일(10 mA 단위 가정)은 실기기 검증이 필요한 항목입니다.
          - 커밋 시 BMS 오류 카운터가 초기화됩니다(설계 반영).
          - 백업 v1에는 캘리브레이션 값·MOS 상태가 포함되지 않습니다.
          - debug key로 서명된 알파 테스트 빌드입니다.
          - JBD / Jiabaida의 공식 앱이 아닙니다.
          EOF

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "dist/${APK_NAME}" "dist/${APK_NAME}.sha256" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${RELEASE_TAG}" --notes-file release-notes.md --prerelease --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" "dist/${APK_NAME}" "dist/${APK_NAME}.sha256" \
              --target "${GITHUB_SHA}" \
              --title "JBD BMS Manager v0.1.0-alpha.9" \
              --notes-file release-notes.md \
              --prerelease \
              --repo "${GITHUB_REPOSITORY}"
          fi
