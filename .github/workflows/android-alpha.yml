name: Android Alpha Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "overlays/**"
      - "scripts/apply-product-overlay.py"
      - ".github/workflows/android-alpha.yml"

permissions:
  contents: write

concurrency:
  group: android-alpha
  cancel-in-progress: true

env:
  UPSTREAM_REPO: gytxtx/OpenJBD
  UPSTREAM_COMMIT: 7e3e225a128f6e0d69425b98a2670d8d69594885
  RELEASE_TAG: v0.1.0-alpha.2
  APK_NAME: jbd-bms-manager-v0.1.0-alpha.2.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JBD BMS Manager
        uses: actions/checkout@v6
        with:
          path: manager

      - name: Checkout pinned OpenJBD baseline
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream-src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream-src/**/*.gradle*

      - name: Apply JBD BMS Manager product overlay
        run: python3 manager/scripts/apply-product-overlay.py upstream-src

      - name: Grant Gradle wrapper permission
        run: chmod +x upstream-src/gradlew

      - name: Run unit tests
        working-directory: upstream-src
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: upstream-src
        run: ./gradlew assembleDebug

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp upstream-src/app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" > "dist/${APK_NAME}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: jbd-bms-manager-alpha-apk
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Write prerelease notes
        if: github.ref == 'refs/heads/main'
        run: |
          cat > release-notes.md <<'EOF'
          ## JBD BMS Manager v0.1.0-alpha.2

          Android 16 상단 헤더 인셋 보정 테스트 빌드입니다.

          ### 변경 내용
          - 메인 화면뿐 아니라 장치 검색, About, Licenses 등 독립 Activity의 Toolbar에도 status-bar inset 적용
          - Android 16 / API 36에서 상단 헤더가 화면 밖으로 밀리는 현상 수정
          - 기존 하단 Navigation inset 보정 유지
          - 한국어 UI 및 한국어 선택 기능 유지
          - 앱 표시명 `JBD BMS Manager`
          - applicationId `com.openit.jbdbmsmanager`

          ### 주의
          - debug key로 서명된 알파 테스트 빌드입니다.
          - Maintenance Mode 및 캘리브레이션 쓰기 기능은 아직 포함하지 않습니다.
          - JBD / Jiabaida의 공식 앱이 아닙니다.
          EOF

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "dist/${APK_NAME}" "dist/${APK_NAME}.sha256" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${RELEASE_TAG}" --notes-file release-notes.md --prerelease --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" "dist/${APK_NAME}" "dist/${APK_NAME}.sha256" \
              --target "${GITHUB_SHA}" \
              --title "JBD BMS Manager v0.1.0-alpha.2" \
              --notes-file release-notes.md \
              --prerelease \
              --repo "${GITHUB_REPOSITORY}"
          fi
