name: Android Alpha Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "overlays/**"
      - "scripts/apply-product-overlay.py"
      - "scripts/apply-alpha3.py"
      - "scripts/apply-alpha4.py"
      - "scripts/apply-alpha5.py"
      - ".github/workflows/android-alpha.yml"

permissions:
  contents: write

concurrency:
  group: android-alpha
  cancel-in-progress: true

env:
  UPSTREAM_REPO: gytxtx/OpenJBD
  UPSTREAM_COMMIT: 7e3e225a128f6e0d69425b98a2670d8d69594885
  RELEASE_TAG: v0.1.0-alpha.5
  APK_NAME: jbd-bms-manager-v0.1.0-alpha.5.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JBD BMS Manager
        uses: actions/checkout@v6
        with:
          path: manager

      - name: Checkout pinned OpenJBD baseline
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream-src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream-src/**/*.gradle*

      - name: Apply JBD BMS Manager product overlay
        run: |
          python3 manager/scripts/apply-product-overlay.py upstream-src
          python3 manager/scripts/apply-alpha3.py upstream-src
          python3 manager/scripts/apply-alpha4.py upstream-src
          python3 manager/scripts/apply-alpha5.py upstream-src

      - name: Grant Gradle wrapper permission
        run: chmod +x upstream-src/gradlew

      - name: Run unit tests
        working-directory: upstream-src
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: upstream-src
        run: ./gradlew assembleDebug

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp upstream-src/app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" > "dist/${APK_NAME}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: jbd-bms-manager-alpha-apk
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Write prerelease notes
        if: github.ref == 'refs/heads/main'
        run: |
          cat > release-notes.md <<'EOF'
          ## JBD BMS Manager v0.1.0-alpha.5

          BMS 장치 관리 진입점을 상단 왼쪽 버튼 하나로 통합한 테스트 빌드입니다.

          ### 변경 내용
          - 상단 오른쪽 BMS 콤보/클릭 기능 제거
          - 상단 오른쪽은 현재 연결 BMS 이름 또는 `BMS 미연결` 상태만 표시
          - 상단 왼쪽 장치 버튼을 BMS 관리의 유일한 진입점으로 통합
          - 등록/저장된 BMS가 없으면 장치 검색 화면으로 바로 이동
          - 저장된 BMS가 있으면 등록 목록 화면을 먼저 표시
          - 등록 목록 하단에 `+ 새 BMS 검색` 버튼 추가
          - 저장된 BMS 항목 선택 시 해당 장치로 재연결
          - 기존 5개 하단 메뉴와 Android 16 inset 보정 유지
          - 사용자 제공 병아리 앱 아이콘 유지

          ### 현재 제한
          - 현재 알파는 OpenJBD 기반 마지막 1개 장치 저장 구조를 사용합니다.
          - 실제 다중 BMS 영구 레지스트리, 별칭 편집, RSSI 상태 표시는 후속 구현 대상입니다.
          - debug key로 서명된 알파 테스트 빌드입니다.
          - JBD / Jiabaida의 공식 앱이 아닙니다.
          EOF

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "dist/${APK_NAME}" "dist/${APK_NAME}.sha256" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${RELEASE_TAG}" --notes-file release-notes.md --prerelease --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" "dist/${APK_NAME}" "dist/${APK_NAME}.sha256" \
              --target "${GITHUB_SHA}" \
              --title "JBD BMS Manager v0.1.0-alpha.5" \
              --notes-file release-notes.md \
              --prerelease \
              --repo "${GITHUB_REPOSITORY}"
          fi
