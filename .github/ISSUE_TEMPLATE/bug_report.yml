name: Bug report
description: Report a reproducible problem in JBD BMS Manager
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Android version, device, app commit/version, BMS model/firmware if relevant.
      placeholder: |
        Android:
        Device:
        App commit/version:
        BMS model:
        BMS firmware:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / screenshots / evidence
      description: Remove secrets or personal information before attaching.
  - type: dropdown
    id: hardware
    attributes:
      label: Does this require physical BMS hardware to reproduce?
      options:
        - Unknown
        - No
        - Yes
    validations:
      required: true
